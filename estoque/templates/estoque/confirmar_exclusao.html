{% extends "estoque/base.html" %}
{% block conteudo %}
<h1>Excluir?</h1>
<p>Confirma a exclusão de <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
<form method="post">{% csrf_token %}
  <button class="btn perigo">Sim, excluir</button>
  <a href="javascript:history.back()">Cancelar</a>
</form>
{% endblock %}
