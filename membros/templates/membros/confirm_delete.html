<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
</head>
<body>
    <h1>Confirmar Exclusão</h1>
    <p>Tem certeza de que deseja apagar o membro "<strong>{{ object.nome }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, apagar</button>
    </form>

    <br>
    <a href="{% url 'home' %}">Cancelar</a>
</body>
</html>
